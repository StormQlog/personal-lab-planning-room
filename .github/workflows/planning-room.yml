name: Planning Room

on:
  pull_request:
    paths:
      - "portal/**"
      - "scripts/validate-planning-room.mjs"
      - "scripts/serve-planning-room.mjs"
      - "tests/portal/**"
      - ".github/workflows/planning-room.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "planning-room-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate public-safe data
        run: node scripts/validate-planning-room.mjs
      - name: Test planning bridge
        run: node --test tests/portal/planner-core.test.mjs tests/portal/status.test.mjs

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enforce publication approval
        run: node scripts/validate-planning-room.mjs --deploy
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: portal
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
